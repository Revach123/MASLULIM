name: Backfill CMA Reports History

on:
  workflow_dispatch:
    inputs:
      force_rescan:
        description: "סמן ✓ רק אם רוצים להריץ שוב את כל ה-backfill מההתחלה, גם אם הוא כבר סומן כהושלם בעבר. בהרצה ראשונה תשאיר לא מסומן."
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install
      - run: npx playwright install --with-deps chromium

      - name: Run backfill
        env:
          MODE: backfill
          FORCE_BACKFILL: ${{ github.event.inputs.force_rescan }}
        run: node scripts/run.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "cma-reports-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Backfill historical reports [skip ci]"
            git push
          fi
