name: Policy probe (page network diagnostics)

# אבחון עמודים שלא החזירו מסמכים: כל כתובת = ג'וב; רינדור בדפדפן (xvfb) ורישום בקשות רשת/קישורים/פקדים ל-log.
on:
  push:
    branches: [claude/tender-wozniak-of4b7i]
    paths: [".github/workflows/policy_probe.yml", "scripts/policy/probe_page.py"]
  workflow_dispatch:
    inputs:
      urls:
        description: "כתובות מופרדות ברווח"
        required: true

jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      urls: ${{ steps.u.outputs.urls }}
    steps:
      - id: u
        env:
          URLS: ${{ inputs.urls }}
        run: |
          [ -z "$URLS" ] && URLS="https://www.menoramivt.co.il/rep-list/about-insurance/participating-portfolio-info/investment-policy https://www.hcsra.co.il/insurances/investments-credit-realestate/investments/ https://www.as-invest.co.il/interstedin/gemel/%D7%90%D7%9C%D7%98%D7%A9%D7%95%D7%9C%D7%A8-%D7%A9%D7%97%D7%9D-%D7%92%D7%9E%D7%9C-%D7%9E%D7%A0%D7%99%D7%95%D7%AA/ https://www.yl-invest.co.il/%D7%A7%D7%95%D7%A4%D7%95%D7%AA-%D7%92%D7%9E%D7%9C-%D7%9C%D7%94%D7%A9%D7%A7%D7%A2%D7%94-%D7%9E%D7%A1%D7%9C%D7%95%D7%9C-%D7%9E%D7%A0%D7%99%D7%95%D7%AA/ https://www.yl-invest.co.il/17/"
          echo "urls=$(python3 -c 'import json,sys;print(json.dumps(sys.argv[1:]))' $URLS)" >> "$GITHUB_OUTPUT"

  probe:
    needs: list
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        url: ${{ fromJson(needs.list.outputs.urls) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install -q requests beautifulsoup4 playwright
          python -m playwright install --with-deps chromium >/dev/null
          POLICY_HEADED=1 xvfb-run -a python -m scripts.policy.probe_page "${{ matrix.url }}"
