name: Policy probe (page network diagnostics)

# אבחון עמודים שלא החזירו מסמכים: כל כתובת = ג'וב; רינדור בדפדפן (xvfb) ורישום בקשות רשת/קישורים/פקדים ל-log.
on:
  push:
    branches: [claude/tender-wozniak-of4b7i]
    paths: [".github/workflows/policy_probe.yml", "scripts/policy/probe_page.py"]
  workflow_dispatch:
    inputs:
      urls:
        description: "כתובות מופרדות ברווח"
        required: true

jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      urls: ${{ steps.u.outputs.urls }}
    steps:
      - id: u
        env:
          URLS: ${{ inputs.urls }}
        run: |
          [ -z "$URLS" ] && URLS="https://www.clalbit.co.il/aboutclalinsurance/generalreports/?txtTabId=1&txtReportsYearId=2026&txtCompanyId=1&txtReportTypeId=20"
          echo "urls=$(python3 -c 'import json,sys;print(json.dumps(sys.argv[1:]))' $URLS)" >> "$GITHUB_OUTPUT"

  probe:
    needs: list
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        url: ${{ fromJson(needs.list.outputs.urls) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install -q requests beautifulsoup4 playwright
          python -m playwright install --with-deps chromium >/dev/null
          POLICY_HEADED=1 xvfb-run -a python -m scripts.policy.probe_page "${{ matrix.url }}"
