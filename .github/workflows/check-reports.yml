name: Check CMA Reports

on:
  schedule:
    - cron: "0 * * * *" # כל שעה, לפי UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: cma-reports
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install
      - run: npx playwright install --with-deps chromium

      - name: Run incremental check
        env:
          MODE: incremental
        run: node scripts/run.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "cma-reports-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update reports [skip ci]"
            git push
          fi
