name: Verify main pipeline

on:
  workflow_dispatch:
  schedule:
    # כל יום ראשון ב-02:00 UTC (שעה לפני Publish AUTOPILOT to D1) - כדי
    # שתמיד יהיה מדד MAE עדכני מול הרשמי לפני שה-publish הופך את הנתונים
    # לחיים באתר, וכדי לעקוב אחר סחף (drift) בין ריצה לריצה.
    - cron: "0 2 * * 0"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install requests python-calamine yfinance
      - name: TEMP - Diagnose Invesco ISIN IE00B3YCGJ38 classification
        env:
          REVACH_MATCH_KEY: ${{ secrets.REVACH_MATCH_KEY }}
          PAT: ${{ secrets.PAT }}
        run: |
          python3 -c "
          from scripts.funds_holdings.foreign_etf_reference import (
              fetch_etf_universe, fetch_sec_etf_exposure, build_isin_fractions, _isin_key,
          )
          target = 'IE00B3YCGJ38'
          universe = fetch_etf_universe()
          print('universe size:', len(universe))
          hit = [r for r in universe if _isin_key(r.get('isin')) == target]
          print('in etf universe:', hit)
          sec = fetch_sec_etf_exposure()
          print('sec size:', len(sec))
          hit_sec = [r for r in sec if _isin_key(r.get('isin')) == target]
          print('in sec exposure:', hit_sec)
          fractions = build_isin_fractions(universe, sec)
          print('build_isin_fractions result for target:', fractions.get(target, 'NOT SET'))
          "
      - name: Run main pipeline
        env:
          REVACH_MATCH_KEY: ${{ secrets.REVACH_MATCH_KEY }}
          PAT: ${{ secrets.PAT }}
        run: python -m scripts.funds_holdings.main --reports-dir reports --out-dir out
      - name: Summarize output
        run: |
          python3 -c "
          import json
          master = json.load(open('out/master.json', encoding='utf-8'))
          detail = json.load(open('out/funds_detail.json', encoding='utf-8'))
          print('master rows:', len(master))
          print('detail tracks:', len(detail))
          print('sample master row:', master[0] if master else None)
          # שדות ידועים מ-tracks (verify_tracks_fetch.yml) + מה שהפייפליין מוסיף עצמו
          known = {
              'מפתח', 'כשרות', 'ריבית',
              'אזהרת היתר עסקה','אחוז נכסים נזילים','איזון אקטוארי','אלפא','גלאט הון',
              'ד\"נ הפקדות (ממוצע)','ד\"נ צבירה (ממוצע)','הגדרה מלאה','היתר עסקה חברה',
              'היתר עסקה מתפעל','הכשר','העברות פנימיות','הערת גלאט הון','הפקדות',
              'הפקדות נטו חודשי','התמחות משנית','התמחות ראשית','ח.פ. חברה',
              'ח.פ. חברה מתפעלת','חשיפה לחו\"ל','חשיפה למטח','חשיפה למניות','מדד שארפ',
              'מותר לדעת הרב אלישיב',\"מס' מסלול\",'מספר קופה','מצב','משיכות',
              'נכון לחודש','נכסים (מליונים)','סוג מסלול','סוג מסלול השקעה (רישום)',
              'סוג קרן','סטיית תקן',\"עד''ח\",'פירוט אזהרת היתר עסקה','ר א דביר',
              'שם החברה','שם חברה מתפעלת','שם מסלול ארוך','שם מסלול ההשקעה',
              'שם מסלול קצר','שם קופה/קרן','שם קצר קופה/קרן','תאריך הקמה','תחום',
              'תשואה 12 חודשים','תשואה 3 שנים ממוצע','תשואה 3 שנים מצטבר',
              'תשואה 5 שנים ממוצע','תשואה 5 שנים מצטבר','תשואה חודש אחרון',
              'תשואה כהלכה','תשואה מתחילת שנה','תשואה שנתיים ממוצע','תשואה שנתיים מצטבר',
          }
          extra = set()
          for r in master:
              extra.update(k for k in r.keys() if k not in known)
          print('extra keys not from tracks (siveg pct columns etc):', sorted(extra))
          for r in master:
              if any(k in extra for k in r.keys()):
                  print('example row with siveg pct:', {k: v for k, v in r.items() if k in extra or k == 'מפתח'})
                  break
          "
      - name: Validate equity exposure vs official (חשיפה למניות)
        env:
          REVACH_MATCH_KEY: ${{ secrets.REVACH_MATCH_KEY }}
          PAT: ${{ secrets.PAT }}
        run: python -m scripts.funds_holdings.validate_equity_exposure --reports-dir reports
      - name: Report unmatched foreign funds
        env:
          REVACH_MATCH_KEY: ${{ secrets.REVACH_MATCH_KEY }}
          PAT: ${{ secrets.PAT }}
        run: python -m scripts.funds_holdings.missing_foreign_funds --reports-dir reports
      - uses: actions/upload-artifact@v4
        with:
          name: master-output
          path: out/
