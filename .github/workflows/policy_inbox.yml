name: Policy inbox (extension uploads)

# תוסף ה-Chrome דוחף קבצי מדיניות מאתרים שחוסמים שרתי ענן ל-policy/inbox/<LegalId>/.
# כאן: קליטה לתיקיית החברה -> פרסור -> טבלאות מאוחדות.
on:
  push:
    branches: [main]  # התוסף דוחף ל-main; בענפים אחרים (מיזוגים) אין לקלוט שוב - יוצר התנגשויות
    paths: ["policy/inbox/**"]
  workflow_dispatch:  # workflows אחרים (backfill_lastmod) דוחפים עם GITHUB_TOKEN - push כזה לא מפעיל workflow, dispatch כן

permissions:
  contents: write

concurrency:
  group: policy-inbox
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pdfplumber openpyxl python-docx xlrd
      - name: Ingest, parse, combine, commit (retry on concurrent pushes)
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          B="${GITHUB_REF_NAME}"
          for i in 1 2 3 4 5 6; do
            git fetch -q origin "$B" && git reset -q --hard "origin/$B"
            # מרכיבי תשואה מהמחשב הביתי (policy/inbox/<id>/returns/) -> returns/companies/<id>/ (scripts/returns)
            RIDS=$(python -m scripts.returns.ingest)
            echo "returns ingested: $RIDS"
            for id in $RIDS; do RETURNS_PARSE_BUDGET=600 python -m scripts.returns.extract --only $id; done
            [ -n "$RIDS" ] && python -m scripts.returns.combine
            IDS=$(python -m scripts.policy.ingest_inbox)
            echo "ingested: $IDS"
            [ -z "$IDS" ] && [ -z "$RIDS" ] && break
            for id in $IDS; do POLICY_OUT=policy/companies/$id python -m scripts.policy.extract; done
            [ -n "$IDS" ] && python -m scripts.policy.combine
            git add -A policy returns
            git diff --cached --quiet && break
            git commit -q -m "policy: ingest extension uploads ($IDS)"
            git push -q origin "HEAD:$B" && break
            sleep $((RANDOM % 10 + 5))
          done
