name: Verify tracks fetch

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install requests
      - name: Fetch tracks
        env:
          REVACH_MATCH_KEY: ${{ secrets.REVACH_MATCH_KEY }}
        run: python scripts/funds_holdings/tracks_reference.py
