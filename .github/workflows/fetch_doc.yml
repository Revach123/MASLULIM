name: Fetch reference document

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "כתובת URL אחת (או כמה, מופרדות ברווח) להורדה - שימושי למסמכי רפרנס חסומים מה-sandbox המקומי (gov.il וכו')"
        required: true
        type: string

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install requests pypdf
      - name: Fetch
        run: python -m scripts.cma.fetch_doc ${{ inputs.urls }}
      - uses: actions/upload-artifact@v4
        with:
          name: fetched-doc
          path: doc_out/
