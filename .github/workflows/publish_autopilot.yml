name: Publish AUTOPILOT to D1

on:
  workflow_dispatch:
  schedule:
    # כל יום ראשון ב-03:00 UTC - הפייפליין (סיווג קרנות/ETF, SEC N-PORT
    # חי, נתוני revach וכו') צריך לרוץ מחדש באופן קבוע ולא רק ב-triggering
    # ידני, כדי שהאתר החי יישאר מעודכן עם מקורות הנתונים הדינמיים.
    - cron: "0 3 * * 0"

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore foreign-fund classification cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: fund-class-${{ github.run_id }}
          restore-keys: fund-class-
      - name: Install deps
        run: pip install requests python-calamine yfinance
      - name: Run main pipeline
        env:
          REVACH_MATCH_KEY: ${{ secrets.REVACH_MATCH_KEY }}
          PAT: ${{ secrets.PAT }}
        run: python -m scripts.funds_holdings.main --reports-dir reports --out-dir out
      - name: Build D1 SQL
        run: python -m scripts.funds_holdings.build_d1 --out-dir out
      - name: Verify CF token
        run: |
          curl -s "https://api.cloudflare.com/client/v4/user/tokens/verify" \
            -H "Authorization: Bearer ${{ secrets.CF_D1_TOKEN }}" | head -c 500
          echo
      - name: Load master into D1
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken:  ${{ secrets.CF_D1_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command:   d1 execute maslulim_autopilot --remote --file=out/master.sql -y
      - name: Load funds_detail into D1
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken:  ${{ secrets.CF_D1_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command:   d1 execute maslulim_autopilot --remote --file=out/funds_detail.sql -y
      - name: Load bonds_detail into D1
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken:  ${{ secrets.CF_D1_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command:   d1 execute maslulim_autopilot --remote --file=out/bonds_detail.sql -y
      - name: Load index_exposure into D1
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken:  ${{ secrets.CF_D1_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command:   d1 execute maslulim_autopilot --remote --file=out/index_exposure.sql -y
      - name: Load holdings_detail into D1
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken:  ${{ secrets.CF_D1_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command:   d1 execute maslulim_autopilot --remote --file=out/holdings_detail.sql -y
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: autopilot-output
          path: out/
