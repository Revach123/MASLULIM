name: Policy docs (daily)
# run 4: Mor/Harel parsers, product pages

on:
  push:
    branches: [claude/tender-wozniak-of4b7i]
    paths: [".github/workflows/policy_daily.yml"]
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "LegalId מופרדים ברווח (ריק = הכל)"
        required: false
      reparse:
        description: "ניתוח מחדש של כל המסמכים"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: policy-data
  cancel-in-progress: false

jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 pdfplumber openpyxl python-docx xlrd
      - name: Crawl company sites
        run: python -m scripts.policy.crawl ${{ inputs.only && format('--only {0}', inputs.only) || '' }}
      - name: Extract per-track policy
        run: python -m scripts.policy.extract ${{ inputs.reparse && '--all' || '' }}
      - name: Summary
        run: |
          echo "### מסמכים חדשים/שעודכנו" >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          for d in json.load(open("policy/new_docs.json", encoding="utf-8")):
              print(f"- {d['kind']}: {d['legal_id']} {d['url']}")
          PY
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add policy
          git diff --cached --quiet || git commit -m "policy: daily crawl/extract"
          git pull --rebase origin "${GITHUB_REF_NAME}" && git push
