name: Policy per-company

# כל חברה = ג'וב נפרד שכותב רק ל-policy/companies/<LegalId>/.
# push: רק חברות שקובץ ההגדרות שלהן (scripts/policy/sites/<LegalId>.json) השתנה; שינוי בקוד/ב-workflow ->
#       רק חברות הבדיקה (CANARY) - לא כולן, כדי לא להיחסם ב-WAF של האתרים מריבוי ריצות.
# schedule: כל החברות, כל יום (זיהוי מסמכים חדשים/עדכונים).
on:
  # בלי הפעלה על push: הסריקה היומית רצה עם הקוד העדכני, וסריקות שנכתבות לענף העבודה יצרו התנגשויות מיזוג
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "LegalId מופרדים ברווח (ריק = כולן)"
        required: false
      cloud:
        description: "1 = לסרוק מהענן גם אתרים שמסומנים via=extension (ריצה ידנית, כשהתוסף לא זמין)"
        required: false

permissions:
  contents: write

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      ids: ${{ steps.m.outputs.ids }}
      mode: ${{ steps.m.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: m
        env:
          BEFORE: ${{ github.event.before }}
          ONLY: ${{ inputs.only }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re, subprocess
          from pathlib import Path
          all_ids = sorted(p.stem for p in Path("scripts/policy/sites").glob("*.json"))
          ids = all_ids
          mode = "full"
          if os.environ.get("ONLY"):
              ids = [i for i in all_ids if i in os.environ["ONLY"].split()]
          elif os.environ.get("GITHUB_EVENT_NAME") == "push" and os.environ.get("BEFORE", "").strip("0"):
              changed = subprocess.run(["git", "diff", "--name-only", os.environ["BEFORE"], os.environ["GITHUB_SHA"]],
                                       capture_output=True, text=True).stdout.split()
              site_ids = [m.group(1) for f in changed if (m := re.fullmatch(r"scripts/policy/sites/(\d+)\.json", f))]
              other = [f for f in changed if (f.startswith("scripts/policy/") or f.endswith("policy_sites.yml"))
                       and not re.fullmatch(r"scripts/policy/sites/\d+\.json", f)]
              canary = ["512065202", "512267592"]  # מיטב, הראל גמל - עובדות; בדיקת רגרסיה לשינויי קוד
              ids = sorted((set(site_ids) | (set(canary) if other else set())) & set(all_ids))
              if other and not site_ids and all(f == "scripts/policy/extract.py" for f in other):
                  # רק הפרסר השתנה: פרסור מחדש לכל חברה שיש לה מסמכים, בלי לסרוק אתרים
                  ids = sorted(p.parent.name for p in Path("policy/companies").glob("*/docs_index.json")
                               if json.loads(p.read_text("utf-8")))
                  mode = "parse"
          print("ids=" + json.dumps(ids))
          print("mode=" + mode)
          PY

  company:
    needs: matrix
    if: needs.matrix.outputs.ids != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        id: ${{ fromJson(needs.matrix.outputs.ids) }}
    env:
      ID: ${{ matrix.id }}
      POLICY_OUT: policy/companies/${{ matrix.id }}
    steps:
      - name: Job start time
        run: echo "JOB_T0=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install requests beautifulsoup4 pdfplumber openpyxl python-docx xlrd playwright
          if [ "${{ needs.matrix.outputs.mode }}" != "parse" ]; then python -m playwright install --with-deps chromium; fi
          # סריקות (דן: מכתב מדיניות מסורק) - OCR עברית רק לאתרים שסומנו ocr
          if [ "$(jq -r '.ocr // false' scripts/policy/sites/${{ matrix.id }}.json 2>/dev/null)" = "true" ]; then sudo apt-get update -q >/dev/null; sudo apt-get install -y -q tesseract-ocr tesseract-ocr-heb >/dev/null; fi
      - name: Crawl (snapshot + diff + download)
        if: needs.matrix.outputs.mode != 'parse'
        continue-on-error: true
        env:
          POLICY_FORCE_CLOUD: ${{ inputs.cloud }}
        run: |
          if [ "$(jq -r '.browser // "headless"' scripts/policy/sites/$ID.json)" = "headed" ]; then
            POLICY_HEADED=1 xvfb-run -a python -m scripts.policy.crawl --only "$ID"
          else
            python -m scripts.policy.crawl --only "$ID"
          fi
      - name: Parse
        continue-on-error: true
        # תקציב: מה שנשאר מ-55 הדקות פחות 6 לשמירה; מה שלא הספיק - בריצה הבאה (מסמכים שפוענחו מסומנים)
        run: |
          left=$(( 55*60 - ($(date +%s) - JOB_T0) - 360 ))
          [ "$left" -lt 120 ] && left=120
          POLICY_PARSE_BUDGET=$left python -m scripts.policy.extract
      - name: Summary
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import csv, json, os
          d = os.environ["POLICY_OUT"]
          rp = f"{d}/crawl_report.csv"
          for r in (csv.DictReader(open(rp, encoding="utf-8-sig")) if os.path.exists(rp) else []):
              print(f"**{r['company']}** pages={r['pages']} docs={r['docs']}\n\n{r['errors']}\n")
          for n in ("site_changes.json", "tracks_policy_long.json", "unparsed_layouts.json"):
              p = f"{d}/{n}"
              print(f"- {n}: {len(json.load(open(p, encoding='utf-8'))) if os.path.exists(p) else '-'}")
          PY
      - name: Commit (retry, rebuild combined tables on latest head)
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          B="${GITHUB_REF_NAME}"
          mkdir -p /tmp/out && cp -r "$POLICY_OUT" /tmp/out/$ID
          for i in 1 2 3 4 5 6 7 8; do
            git fetch -q origin "$B" && git reset -q --hard "origin/$B"
            # בלי rm -rf: מסמכים שנוספו ל-head בזמן הריצה (קליטת תוסף, מיזוג) נשמרים - האינדקס מאוחד והחסרים נקראים מחדש
            mkdir -p "$POLICY_OUT" && cp "$POLICY_OUT/docs_index.json" /tmp/head_idx.json 2>/dev/null || echo '{}' > /tmp/head_idx.json
            cp -r /tmp/out/$ID/. "$POLICY_OUT"/
            ADDED=$(python3 - "$POLICY_OUT/docs_index.json" <<'PY'
          import json, sys
          p = sys.argv[1]
          cur = json.load(open(p, encoding="utf-8")) if __import__("os").path.exists(p) else {}
          head = json.load(open("/tmp/head_idx.json", encoding="utf-8"))
          n = 0
          for k, v in head.items():
              if k not in cur:
                  v["parsed_sha"] = None; cur[k] = v; n += 1
          json.dump(cur, open(p, "w", encoding="utf-8"), ensure_ascii=False, indent=1)
          print(n)
          PY
            )
            [ "${ADDED:-0}" != "0" ] && echo "kept $ADDED docs from head" && python -m scripts.policy.extract
            POLICY_OUT= python -m scripts.policy.combine
            git add policy
            if git diff --cached --quiet; then echo "nothing to commit"; break; fi
            git commit -q -m "policy: $ID"
            if git push -q origin "HEAD:$B"; then echo "pushed"; break; fi
            sleep $((RANDOM % 15 + 5))
          done
