name: Returns probe (report API calls)

on:
  push:
    branches: ["claude/**"]
    paths: ["returns/probe_urls.txt"]
  workflow_dispatch:
    inputs:
      urls:
        description: "כתובות מופרדות ברווח (בלי קלט: returns/probe_urls.txt)"
        required: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - env:
          URLS: ${{ inputs.urls }}
        run: |
          pip install -q playwright
          python -m playwright install --with-deps chromium >/dev/null
          POLICY_HEADED=1 xvfb-run -a python -m scripts.returns.probe_api ${URLS:-$(cat returns/probe_urls.txt)}
