name: Policy fund registry (data.gov)
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"   # כל יום, לפני policy_sites (04:00) - מסלול חדש מקבל מספר כבר למחרת
  push:
    paths: ["scripts/policy/fund_registry.py", ".github/workflows/policy_registry.yml"]
permissions:
  contents: write
jobs:
  registry:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests
      - run: python -m scripts.policy.fund_registry
      - name: Commit
        run: |
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git add policy/fund_registry.csv policy/fund_names.csv 2>/dev/null
            git diff --cached --quiet && { echo "no changes"; break; }
            git commit -q -m "policy: fund registry (data.gov)"
            git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep 7
          done
