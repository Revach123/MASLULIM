name: CMA probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install requests playwright
          python -m playwright install --with-deps chromium
      - name: requests + headless
        continue-on-error: true
        run: python scripts/cma/probe.py all
      - name: headful (xvfb)
        continue-on-error: true
        run: xvfb-run -a python scripts/cma/probe.py headful
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: probe_out
          path: probe_out/
