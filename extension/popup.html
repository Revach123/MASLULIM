<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<title>מעקב דוחות רבעוניים</title>
<style>
  body { font-family: Arial, sans-serif; width: 310px; padding: 14px; color: #222; background: #fafafa; }
  h1 { font-size: 15px; margin: 0 0 10px; color: #003366; }
  .card { background: #fff; border: 1px solid #e2e2e2; border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; }
  .row { display: flex; justify-content: space-between; font-size: 12.5px; margin: 4px 0; color: #444; }
  .row b { color: #111; }
  button { width: 100%; padding: 8px; border: none; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; margin-top: 6px; }
  #run { background: #0073aa; color: #fff; }
  #backfill { background: #00539b; color: #fff; }
  #sync-local { background: #2e7d32; color: #fff; }
  #setup { background: #e0e0e0; color: #222; }
  #msg { font-size: 11.5px; color: #2e7d32; min-height: 14px; text-align: center; margin-top: 6px; }
  #err { font-size: 11.5px; color: #cc0000; margin-top: 6px; word-break: break-word; }
  .warn { background: #fff3e0; border: 1px solid #ffb74d; border-radius: 8px; padding: 8px 10px; font-size: 12px; color: #8a4b00; margin-bottom: 10px; }
</style>
</head>
<body>
  <h1>📊 מעקב דוחות רבעוניים - רשות שוק ההון</h1>

  <div id="setup-warn" class="warn" hidden>
    ⚠️ חסרות הגדרות GitHub. לחץ "הגדרות" והזן repo + טוקן.
  </div>
  <div id="block-warn" class="warn" hidden>
    ⚠️ האתר חסם את הבקשה. ודא שאתה גולש מישראל, פתח את אתר רשות שוק ההון בטאב, ונסה שוב.
  </div>

  <div class="card">
    <div class="row"><span>ריצה אחרונה:</span><b id="last-run">—</b></div>
    <div class="row"><span>חדשים בריצה האחרונה:</span><b id="last-new">—</b></div>
    <div class="row"><span>סה"כ דוחות בארכיון:</span><b id="total">—</b></div>
    <div id="err"></div>
  </div>

  <button id="run">🔄 בדוק ומשוך עכשיו</button>
  <button id="backfill">⬇ משיכת כל ההיסטוריה (פעם אחת)</button>
  <button id="sync-local">💾 סנכרן עותק מקומי (מ-git)</button>
  <button id="setup">⚙ הגדרות</button>

  <div id="msg"></div>
  <script src="popup.js"></script>
</body>
</html>
